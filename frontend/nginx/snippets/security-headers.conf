# Repeated in every location: nginx drops inherited add_header once a block sets its own.
# The full CSP comes from the <meta> tag in index.html (csp.ts); frame-ancestors only works as a header.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;

# --- KryzIO: kryzio.goveris.pl ---
# Edge proxy config (copy to /mnt/nginx_gitlab/data/nginx/conf.d/kryzio.goveris.conf).
# Security headers of the page itself come from the frontend image (frontend/nginx/).

# Path without the query string: lat/lon and addresses must not land in access logs
log_format kryzio_privacy '$remote_addr - [$time_local] "$request_method $uri" '
                          '$status $body_bytes_sent $request_time';

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name kryzio.goveris.pl;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name kryzio.goveris.pl;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/goveris.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goveris.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    resolver 127.0.0.11 valid=30s ipv6=off;

    set $frontend_upstream http://kryzio-frontend:8080;
    set $api_upstream      http://kryzio-api:8000;
    set $agent_upstream    http://kryzio-agent:8001;

    access_log /var/log/nginx/kryzio_access.log kryzio_privacy;
    error_log  /var/log/nginx/kryzio_error.log;

    # Requests are small JSON or GET; a chat message is capped by the agent anyway
    client_max_body_size 32k;

    # Inherited by the locations below, none of which sets its own add_header
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    # Overwrite, never append: the services trust this header for per-client rate limits
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    proxy_connect_timeout 10s;

    location ^~ /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass         $api_upstream;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Agent answers take a few LLM rounds (AGENT_REQUEST_DEADLINE_S=45)
    location ^~ /agent/ {
        rewrite ^/agent(/.*)$ $1 break;
        proxy_pass         $agent_upstream;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Static build (frontend/Dockerfile.prod)
    location / {
        proxy_pass         $frontend_upstream;
        proxy_read_timeout 30s;
    }
}
